<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Staph Aureus Experience™</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section id="grid" class="grid" aria-label="Polaroid gallery"></section>

        <nav class="nav" aria-label="Gallery navigation">

            <button id="prevBtn" class="arrow-button" type="button" aria-label="Previous six Polaroids">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M15 5 L8 12 L15 19"></path>
                </svg>
            </button>

            <button id="returnBtn" class="return-button" type="button">
                return to applevioletrobot.com
            </button>

            <button id="nextBtn" class="arrow-button" type="button" aria-label="Next six Polaroids">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 5 L16 12 L9 19"></path>
                </svg>
            </button>

        </nav>

        <footer class="site-footer">
            <strong>The Staph Aureus Experience™</strong>
            <span>Artwork by Alice van Rooyen</span>
            <span><a href="https://applevioletrobot.com">Apple Violet Robot</a></span>
            <span><a href="accessibility.html">Accessibility</a></span>
        </footer>
    </main>

    <div
        id="lightbox"
        class="lightbox hidden"
        role="dialog"
        aria-modal="true"
        aria-label="Enlarged Polaroid image"
        aria-hidden="true"
    >
        <button id="closeBtn" class="close" type="button" aria-label="Close enlarged image">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7 L17 17"></path>
                <path d="M17 7 L7 17"></path>
            </svg>
        </button>

        <img id="lightboxImage" src="" alt="">
    </div>

    <script src="script.js"></script>
</body>
</html>
