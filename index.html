<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Staph Aureus Experience™</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section id="grid" class="grid" aria-label="Polaroid gallery"></section>

        <nav class="nav" aria-label="Gallery navigation">
            <button id="prevBtn" class="arrow-button" type="button" aria-label="Previous six Polaroids">
                <span aria-hidden="true">◀</span>
            </button>

            <button id="returnBtn" class="return-button" type="button">
                Return to AppleVioletRobot website
            </button>

            <button id="nextBtn" class="arrow-button" type="button" aria-label="Next six Polaroids">
                <span aria-hidden="true">▶</span>
            </button>
        </nav>
    </main>

    <div id="lightbox" class="lightbox hidden" aria-hidden="true">
        <button id="closeBtn" class="close" type="button" aria-label="Close enlarged image">&times;</button>
        <img id="lightboxImage" src="" alt="">
    </div>

    <script src="script.js"></script>
</body>
</html>
